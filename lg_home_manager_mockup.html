<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LG Home Manager - Prototype</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        lgred: '#A50034',
                        lglightred: '#FDF2F4',
                        lgdark: '#111827',
                    },
                    fontFamily: {
                        sans: ['Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .phone-frame {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-0 sm:p-4 font-sans text-slate-800">

    <!-- Mobile Container (Simulating Phone Frame on Desktop, Full screen on Mobile) -->
    <div id="app-container" class="w-full sm:max-w-[420px] h-screen sm:h-[850px] bg-slate-50 dark:bg-slate-900 sm:rounded-[40px] flex flex-col relative overflow-hidden phone-frame border-0 sm:border-[8px] border-slate-800 dark:border-slate-700 transition-colors duration-300">

        <!-- Top Status Bar -->
        <div class="h-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-6 flex items-center justify-between text-xs font-semibold text-slate-600 dark:text-slate-300 z-50 shrink-0">
            <span id="current-time">09:41</span>
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full text-emerald-500"></i>
            </div>
        </div>

        <!-- App Header Bar -->
        <header class="px-6 py-3 bg-white dark:bg-slate-900 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between z-40 shrink-0 transition-colors">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-600 to-red-500 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-red-500/20">
                    LG
                </div>
                <div>
                    <h1 class="font-bold text-base text-slate-900 dark:text-white leading-tight">Home Manager</h1>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500">Smart AI Assistant</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:scale-105 transition">
                    <i id="theme-icon" class="fa-solid fa-moon text-sm"></i>
                </button>
                <div class="relative">
                    <button onclick="openModal('notification-modal')" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:scale-105 transition relative">
                        <i class="fa-regular fa-bell text-sm"></i>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-rose-600 rounded-full animate-pulse"></span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area (Scrollable) -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24">
            <!-- Dynamically injected view content will appear here -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 h-20 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-t border-slate-200/60 dark:border-slate-800 px-6 flex items-center justify-around z-40 transition-colors">
            <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center justify-center space-y-1 text-rose-600 dark:text-rose-400 transition" data-target="home">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[11px] font-medium">홈</span>
            </button>
            <button onclick="switchTab('appliances')" class="nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" data-target="appliances">
                <i class="fa-solid fa-plug text-lg"></i>
                <span class="text-[11px] font-medium">가전</span>
            </button>
            <button onclick="switchTab('chores')" class="nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" data-target="chores">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-[11px] font-medium">집안일</span>
            </button>
            <button onclick="switchTab('mypage')" class="nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition" data-target="mypage">
                <i class="fa-solid fa-user text-lg"></i>
                <span class="text-[11px] font-medium">마이페이지</span>
            </button>
        </nav>

        <!-- Notification Modal -->
        <div id="notification-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
            <div class="bg-white dark:bg-slate-800 w-full sm:max-w-md rounded-t-[30px] sm:rounded-3xl p-6 shadow-2xl max-h-[80vh] overflow-y-auto animate-in fade-in slide-in-from-bottom-5">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white flex items-center">
                        <i class="fa-solid fa-bell text-rose-600 mr-2"></i> 실시간 알림 센터
                    </h3>
                    <button onclick="closeModal('notification-modal')" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-300">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="space-y-3">
                    <div class="p-4 rounded-2xl bg-rose-50 dark:bg-slate-700/50 border border-rose-100 dark:border-slate-600 flex items-start space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-rose-500 text-white flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-utensils"></i>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-semibold text-sm text-slate-900 dark:text-white">냉장고 소비기한 임박</h4>
                            <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">'대파' 소비기한이 1일 남았습니다. AI 추천 요리를 확인해보세요.</p>
                            <span class="text-[10px] text-rose-600 dark:text-rose-400 mt-2 block font-medium">10분 전</span>
                        </div>
                    </div>
                    <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-600 flex items-start space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-500 text-white flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-shirt"></i>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-semibold text-sm text-slate-900 dark:text-white">세탁 완료 안내</h4>
                            <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">표준 코스 세탁이 완료되었습니다. 건조기 연동을 권장합니다.</p>
                            <span class="text-[10px] text-slate-400 mt-2 block font-medium">35분 전</span>
                        </div>
                    </div>
                    <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-700/50 border border-slate-100 dark:border-slate-600 flex items-start space-x-3">
                        <div class="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-robot"></i>
                        </div>
                        <div class="flex-1">
                            <h4 class="font-semibold text-sm text-slate-900 dark:text-white">로봇청소기 청소 완료</h4>
                            <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5">거실 및 주방 구역 청소가 성공적으로 끝났습니다.</p>
                            <span class="text-[10px] text-slate-400 mt-2 block font-medium">2시간 전</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recipe Modal / Detail Action -->
        <div id="action-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
            <div id="modal-content-box" class="bg-white dark:bg-slate-800 w-full sm:max-w-md rounded-t-[30px] sm:rounded-3xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
                <!-- Dynamically populated inside openActionModal -->
            </div>
        </div>

        <!-- Toast Notification Bar -->
        <div id="toast" class="absolute top-14 left-1/2 -translate-x-1/2 bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2">
            <i class="fa-solid fa-circle-check text-emerald-400 dark:text-emerald-600"></i>
            <span id="toast-message">명령이 전송되었습니다.</span>
        </div>

    </div>

    <script>
        // State Management
        let currentTab = 'home';
        let isDarkMode = false;

        // Mock Data for Appliances & Chores
        const appState = {
            appliances: {
                fridge: { name: '디오스 오브제컬렉션 냉장고', status: '정상 작동중', temp: '김치 -1℃ / 냉장 3℃', icon: 'fa-snowflake', bg: 'bg-sky-500', alert: '대파 소비기한 1일 남음' },
                dishwasher: { name: '트루스팀 식기세척기', status: '세척 완료', temp: '고온살균 완료', icon: 'fa-utensils', bg: 'bg-emerald-500', alert: '식기를 꺼내주세요' },
                washer: { name: '워시타워 세탁기', status: '세탁 완료', temp: '표준 코스 (탈수 완료)', icon: 'fa-shirt', bg: 'bg-indigo-500', alert: '건조기 사용 권장' },
                oven: { name: '광파오븐', status: '대기 중', temp: '실온 22℃', icon: 'fa-fire-burner', bg: 'bg-amber-500', alert: null },
                cleaner: { name: 'R9 로봇청소기', status: '충전 중 (100%)', temp: '스테이션 도킹됨', icon: 'fa-robot', bg: 'bg-purple-500', alert: null },
                ac: { name: '휘센 타워 에어컨', status: '운전 중', temp: '24℃ / 청정 공기', icon: 'fa-wind', bg: 'bg-teal-500', alert: null }
            },
            ingredients: [
                { name: '대파', dday: 'D-1', category: '채소', img: 'https://placehold.co/100x100/10b981/ffffff?text=GreenOnion' },
                { name: '닭가슴살', dday: 'D-2', category: '육류', img: 'https://placehold.co/100x100/f43f5e/ffffff?text=Chicken' },
                { name: '계란', dday: 'D-4', category: '신선', img: 'https://placehold.co/100x100/f59e0b/ffffff?text=Eggs' },
                { name: '우유', dday: 'D-3', category: '유제품', img: 'https://placehold.co/100x100/3b82f6/ffffff?text=Milk' }
            ],
            recipes: [
                {
                    title: '매콤 닭가슴살 대파 볶음밥',
                    time: '15분',
                    difficulty: '쉬움',
                    servings: '2인분',
                    desc: '소비기한이 임박한 대파와 닭가슴살을 활용한 간편 한 끼',
                    ingredients: ['닭가슴살', '대파', '계란', '밥', '간장', '참기름'],
                    steps: [
                        '대파를 송송 썰고 닭가슴살을 한 입 크기로 썹니다.',
                        '팬에 기름을 두르고 대파를볶아 파기름을 냅니다.',
                        '닭가슴살을 넣고 익힌 뒤 밥과 양념을 넣고 볶아줍니다.',
                        '광파오븐 스마트 조리 코스로 데워 완성합니다.'
                    ]
                },
                {
                    title: '대파 계란죽',
                    time: '10분',
                    difficulty: '매우 쉬움',
                    servings: '1인분',
                    desc: '속이 편안해지는 따뜻한 영양 계란죽',
                    ingredients: ['대파', '계란', '밥', '소금', '참기름'],
                    steps: [
                        '냄비에 물과 밥을 넣고 끓입니다.',
                        '잘게 썬 대파를 넣고 푹 끓여줍니다.',
                        '풀어놓은 계란을 두르고 저어준 뒤 참기름으로 마무리합니다.'
                    ]
                }
            ]
        };

        // Initialize clock and views
        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            renderView('home');
        };

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').innerText = `${hours}:${minutes}`;
        }

        // Dark Mode Toggle
        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            const container = document.getElementById('app-container');
            const themeIcon = document.getElementById('theme-icon');
            if (isDarkMode) {
                container.classList.add('dark');
                themeIcon.className = 'fa-solid fa-sun text-sm text-amber-400';
            } else {
                container.classList.remove('dark');
                themeIcon.className = 'fa-solid fa-moon text-sm';
            }
        }

        // Navigation Switcher
        function switchTab(tabName) {
            currentTab = tabName;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if(btn.dataset.target === tabName) {
                    btn.className = 'nav-btn flex flex-col items-center justify-center space-y-1 text-rose-600 dark:text-rose-400 transition';
                } else {
                    btn.className = 'nav-btn flex flex-col items-center justify-center space-y-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition';
                }
            });
            renderView(tabName);
        }

        function renderView(view) {
            const main = document.getElementById('main-content');
            main.scrollTop = 0;

            if (view === 'home') {
                main.innerHTML = `
                    <div class="p-6 space-y-6 animate-in fade-in duration-300">
                        <!-- Greeting & AI Banner -->
                        <div class="bg-gradient-to-br from-rose-600 to-red-700 rounded-3xl p-6 text-white shadow-xl shadow-red-500/20 relative overflow-hidden">
                            <div class="absolute -right-6 -bottom-6 w-32 h-32 bg-white/10 rounded-full blur-xl pointer-events-none"></div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-[11px] font-semibold tracking-wide flex items-center">
                                    <i class="fa-solid fa-sparkles mr-1.5 text-amber-300"></i> LG ThinQ AI 추천
                                </span>
                                <span class="text-xs text-rose-100">오후 6:30</span>
                            </div>
                            <h2 class="text-xl font-bold mb-1">퇴근길 맞춤 가전 루틴</h2>
                            <p class="text-xs text-rose-100 mb-5 leading-relaxed">집안일 3건과 소비기한 임박 식재료가 있어요. 스마트하게 처리해보세요.</p>
                            <button onclick="switchTab('chores')" class="bg-white text-rose-700 text-xs font-bold px-4 py-2.5 rounded-xl shadow-md hover:bg-rose-50 transition flex items-center justify-center space-x-2 w-full">
                                <span>지금 해야 할 일 바로가기</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>

                        <!-- Priority Tasks Section -->
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-bold text-slate-900 dark:text-white text-sm flex items-center">
                                    <span class="w-2 h-2 rounded-full bg-rose-600 mr-2 animate-ping"></span> 지금 해야 할 집안일
                                </h3>
                                <span class="text-xs text-rose-600 dark:text-rose-400 font-semibold cursor-pointer" onclick="switchTab('chores')">전체보기</span>
                            </div>
                            <div class="space-y-3">
                                <div onclick="openApplianceDetail('dishwasher')" class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-rose-300 transition group">
                                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg shrink-0 group-hover:scale-105 transition">
                                        <i class="fa-solid fa-utensils"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center justify-between">
                                            <h4 class="font-semibold text-sm text-slate-900 dark:text-white truncate">식기세척기 세척 완료</h4>
                                            <span class="text-[10px] bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 px-2 py-0.5 rounded-full font-medium">완료</span>
                                        </div>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">식기를 꺼내주세요 (고온살균 완료)</p>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                                </div>

                                <div onclick="openFridgeService()" class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-rose-300 transition group">
                                    <div class="w-12 h-12 rounded-2xl bg-sky-50 dark:bg-slate-700 text-sky-600 dark:text-sky-400 flex items-center justify-center text-lg shrink-0 group-hover:scale-105 transition">
                                        <i class="fa-solid fa-snowflake"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center justify-between">
                                            <h4 class="font-semibold text-sm text-slate-900 dark:text-white truncate">냉장고 대파 소비기한 임박</h4>
                                            <span class="text-[10px] bg-rose-100 dark:bg-rose-900/50 text-rose-700 dark:text-rose-300 px-2 py-0.5 rounded-full font-medium">D-1</span>
                                        </div>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">오늘 저녁 요리에 활용해보세요</p>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                                </div>

                                <div onclick="openApplianceDetail('washer')" class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center space-x-4 cursor-pointer hover:border-rose-300 transition group">
                                    <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-lg shrink-0 group-hover:scale-105 transition">
                                        <i class="fa-solid fa-shirt"></i>
                                    </div>
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center justify-between">
                                            <h4 class="font-semibold text-sm text-slate-900 dark:text-white truncate">세탁기 세탁 완료</h4>
                                            <span class="text-[10px] bg-indigo-100 dark:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 px-2 py-0.5 rounded-full font-medium">탈수완료</span>
                                        </div>
                                        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">건조기 연동 코스 사용을 권장합니다</p>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-slate-300 text-xs"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Quick Appliances Grid Preview -->
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <h3 class="font-bold text-slate-900 dark:text-white text-sm">연결된 가전 상태</h3>
                                <span class="text-xs text-slate-400 hover:text-slate-600 cursor-pointer" onclick="switchTab('appliances')">전체보기</span>
                            </div>
                            <div class="grid grid-cols-3 gap-3">
                                <div onclick="openApplianceDetail('fridge')" class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl border border-slate-100 dark:border-slate-700 text-center cursor-pointer hover:shadow-md transition">
                                    <div class="w-10 h-10 mx-auto mb-2 rounded-xl bg-sky-100 dark:bg-sky-900/50 text-sky-600 dark:text-sky-400 flex items-center justify-center">
                                        <i class="fa-solid fa-snowflake"></i>
                                    </div>
                                    <h4 class="font-semibold text-xs text-slate-900 dark:text-white truncate">냉장고</h4>
                                    <p class="text-[10px] text-emerald-600 dark:text-emerald-400 mt-0.5 font-medium">정상</p>

            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>
</body>
</html>
